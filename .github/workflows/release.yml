# 发布:推送 v* 标签触发 → 测试 → 打包 NSIS 安装器 + portable 绿色版
#   → 发布 GitHub Releases(先草稿,产物上齐后置为公开)→ 生成 MCPB 与源码 zip 并附到 Release
# 分发不依赖 npm:桌面安装包/HTTP 端点/MCPB/插件/skill 全部开箱即用,无需注册任何账号或配置任何 secret。
# 注意:electron-builder.yml 的 publish 块保持只有 provider/owner/repo——2026-09-20 的 v1.0.0 CI 曾对含
# releaseType 的 publish 配置报 schema 校验错(provider must be equal to constant);「非草稿」由本文件
# 末步 gh release edit --draft=false 完成,不依赖 electron-builder 的 releaseType。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 用实际仓库归属替换 OWNER 占位符(打包元数据)
        shell: pwsh
        run: |
          $owner = $env:GITHUB_REPOSITORY.Split("/")[0]
          foreach ($f in @("core/package.json", "studio/electron-builder.yml")) {
            (Get-Content $f -Raw) -replace "OWNER", $owner | Set-Content $f -NoNewline
          }

      - name: 核心引擎:安装 + 测试 + 构建
        working-directory: core
        run: |
          npm ci --no-fund --no-audit
          npm test
          npm run build

      - name: 桌面端:安装 + 类型检查 + 构建
        working-directory: studio
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run build

      - name: 打包并发布到 GitHub Releases(NSIS + portable + 自动更新元数据)
        working-directory: studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish

      - name: 打包失败诊断(打印生效配置与实际解析的版本)
        if: failure()
        working-directory: studio
        shell: pwsh
        run: |
          "=== electron-builder.yml ==="
          Get-Content electron-builder.yml
          "=== 实际解析版本 ==="
          npm ls electron-builder app-builder-lib --depth=0

      - name: 生成 MCPB 一键安装包(Claude Desktop 拖入即装)
        working-directory: core
        run: |
          node scripts/make-mcpb.mjs
          $f = Get-ChildItem "*.mcpb" | Select-Object -First 1
          "MCPB_FILE=$($f.Name)" | Add-Content $env:GITHUB_ENV
        shell: pwsh

      - name: 附加 MCPB 与源码 zip 到 Release 并置为公开
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          git archive --format=zip -o "VersionControlStudio-src-$tag.zip" HEAD
          $files = @("VersionControlStudio-src-$tag.zip")
          if ($env:MCPB_FILE) { $files += $env:MCPB_FILE }
          gh release upload "$tag" @files --clobber --repo $env:GITHUB_REPOSITORY
          gh release edit "$tag" --draft=false --latest --repo $env:GITHUB_REPOSITORY
