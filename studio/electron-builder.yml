# electron-builder 打包配置:NSIS 安装器 + portable 绿色版双产物,发布到 GitHub Releases。
# 归属已填实际仓库(ooooooomg),不要在此文件使用任何占位符(发布链无替换步骤)。
# 历史教训(v1.0.0/v1.0.1 两轮 CI 失败的真正根因):原 release.yml 的 -replace "OWNER" 大小写
# 不敏感,会把下方键名 owner: 也替换掉,publish 对象因未知属性被 schema 拒绝。
appId: io.github.ooooooomg.versioncontrol-studio
productName: VersionControlStudio
directories:
  output: release
  buildResources: resources
files:
  - "dist/**"
  - "resources/icons/**"
asar: true
# stdio 桥与核心引擎解包到 app.asar.unpacked:AI 客户端以外部进程拉起它们,读不了 asar
asarUnpack:
  - "dist/main/stdio-bridge.mjs"
  - "node_modules/versioncontrol-mcp/**"
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: VersionControlStudio
  artifactName: ${productName}-${version}-Setup.${ext}
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
# publish 只放 provider/owner/repo 三个键,勿加 releaseType 等额外键(保持 schema 最小面);
# 「发布非草稿」由 release.yml 末步 gh release edit --draft=false 完成。
publish:
  provider: github
  owner: ooooooomg
  repo: VersionControlStudio
